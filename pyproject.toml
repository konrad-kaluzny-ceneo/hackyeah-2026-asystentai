[project]
name = "asystentai"
version = "0.1.0"
description = "Python environment for tabular data processing and classical ML."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "pydantic>=2.7",
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
